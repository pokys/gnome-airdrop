name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Fedora 44 x86_64 / GNOME 50
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Audit publication sources
        run: ./tools/audit.sh
      - name: Build and test in disposable Fedora container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project:rw" -w /project \
            registry.fedoraproject.org/fedora:44 \
            /bin/bash ./tools/ci-container.sh
      - name: Assemble download assets
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_SHA: ${{ github.sha }}
        run: python3 tools/release-assets.py
      - name: Save downloadable build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gnome-airdrop-fedora44-x86_64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish version downloads
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gnome-airdrop-fedora44-x86_64
          path: release
      - name: Create release and attach tested files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.zip ./*.tar.gz ./SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" ./*.zip ./*.tar.gz ./SHA256SUMS \
              --verify-tag --title "GNOME AirDrop $RELEASE_TAG" --notes-file RELEASE-NOTES.md
          fi
